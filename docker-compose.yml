services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - private_media:/srv/physiocare/media
      - ./staticfiles:/srv/physiocare/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  reminders:
    build: .
    env_file:
      - .env
    entrypoint: []
    command:
      - python
      - manage.py
      - send_appointment_reminders
      - --watch
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  private_media:
  postgres_data:
